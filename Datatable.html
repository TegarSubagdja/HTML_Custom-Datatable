<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Orange Datatable - Fully Functional</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-orange: #FF6B00;
            --brand-orange-dark: #E66000;
            --brand-orange-soft: #FFF1E7;
            --brand-dark: #1E293B;
            --brand-gray: #64748B;
            --brand-border: #E2E8F0;
            --bg-light: #F8FAFC;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F1F5F9;
            padding: 2rem 1rem;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--brand-border);
            overflow: hidden;
        }

        /* --- HEADER TOOLBAR --- */
        .header-toolbar {
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--brand-border);
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-control {
            position: relative;
            min-width: 300px;
        }
        .search-control i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--brand-gray);
            z-index: 10;
        }
        .search-control input {
            padding-left: 40px !important;
            height: 42px;
            border-radius: 8px;
            border: 1px solid var(--brand-border);
            background: var(--bg-light);
            font-size: 14px;
        }
        .search-control input:focus {
            border-color: var(--brand-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1);
            background: #fff;
        }

        /* --- TABLE --- */
        .table thead th {
            background-color: var(--bg-light);
            color: var(--brand-gray);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
            padding: 14px 20px;
        }
        .table tbody td {
            padding: 14px 20px;
            vertical-align: middle;
            font-size: 14px;
            border-bottom: 1px solid var(--brand-border);
        }

        /* --- FOOTER & PAGINATION --- */
        .table-footer {
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--brand-border);
        }

        .dataTables_info {
            font-size: 13px;
            color: var(--brand-gray);
        }

        .pagination { margin: 0; gap: 4px; }
        .page-item .page-link {
            border: none;
            background-color: var(--bg-light);
            color: var(--brand-dark);
            border-radius: 6px !important;
            font-size: 13px;
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-item.active .page-link {
            background-color: var(--brand-orange) !important;
            color: white !important;
        }

        /* --- COMPONENTS --- */
        .btn-add {
            background: var(--brand-orange);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-add:hover { background: var(--brand-orange-dark); color: #fff; }

        .btn-export-pill {
            background: white;
            border: 1px solid var(--brand-border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--brand-gray);
            font-weight: 500;
        }
        .btn-export-pill:hover { background: var(--bg-light); }

        .icon-box {
            width: 38px; height: 38px;
            background: var(--brand-orange-soft);
            color: var(--brand-orange);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }

        /* Hide Default DT elements */
        .dataTables_filter, .dt-buttons { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="table-card">
        
        <div class="header-toolbar">
            <div class="search-control">
                <i class='bx bx-search'></i>
                <input type="text" id="customSearchInput" class="form-control" placeholder="Cari data produk...">
            </div>
            
            <div class="d-flex gap-2">
                <div class="dropdown">
                    <button class="btn btn-export-pill dropdown-toggle shadow-none" data-bs-toggle="dropdown">
                        <i class='bx bx-export me-1'></i> Export
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                        <li><a class="dropdown-item py-2" href="javascript:void(0);" id="btn-print"><i class='bx bx-printer me-2'></i> Print</a></li>
                        <li><a class="dropdown-item py-2" href="javascript:void(0);" id="btn-excel"><i class='bx bx-file me-2'></i> Excel</a></li>
                        <li><a class="dropdown-item py-2" href="javascript:void(0);" id="btn-pdf"><i class='bx bxs-file-pdf me-2'></i> PDF</a></li>
                    </ul>
                </div>
                
                <button class="btn-add">
                    <i class='bx bx-plus me-1'></i> Tambah Baru
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table id="premiumTable" class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Info Produk</th>
                        <th>Kategori</th>
                        <th>Stok</th>
                        <th>Harga</th>
                        <th class="text-end">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <div class="icon-box"><i class='bx bx-shopping-bag'></i></div>
                                <div>
                                    <div class="fw-bold">Nike Air Max 2024</div>
                                    <small class="text-muted">SKU: NK-990</small>
                                </div>
                            </div>
                        </td>
                        <td>Fashion</td>
                        <td>124 Unit</td>
                        <td class="fw-semibold">Rp 2.450.000</td>
                        <td class="text-end"><button class="btn btn-sm text-secondary"><i class='bx bx-dots-vertical-rounded fs-5'></i></button></td>
                    </tr>
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <div class="icon-box"><i class='bx bx-mobile-alt'></i></div>
                                <div>
                                    <div class="fw-bold">iPhone 15 Pro Max</div>
                                    <small class="text-muted">SKU: IP-15PM</small>
                                </div>
                            </div>
                        </td>
                        <td>Gadget</td>
                        <td>45 Unit</td>
                        <td class="fw-semibold">Rp 24.999.000</td>
                        <td class="text-end"><button class="btn btn-sm text-secondary"><i class='bx bx-dots-vertical-rounded fs-5'></i></button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="table-footer">
            <div id="infoPlacement"></div>
            <div id="pagingPlacement"></div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<script>
    $(document).ready(function() {
        const table = $('#premiumTable').DataTable({
            dom: 'Bfrtip', // Inisialisasi Buttons
            buttons: [
                { extend: 'excel', className: 'd-none', title: 'Data Produk' },
                { extend: 'pdf', className: 'd-none', title: 'Data Produk' },
                { extend: 'print', className: 'd-none', title: 'Data Produk' }
            ],
            language: {
                info: "Menampilkan _START_ sampai _END_ dari _TOTAL_ data",
                paginate: {
                    next: '<i class="bx bx-chevron-right"></i>',
                    previous: '<i class="bx bx-chevron-left"></i>'
                }
            },
            pageLength: 10,
            drawCallback: function() {
                // Pindahkan info & pagination ke lokasi kustom
                $('.dataTables_info').appendTo('#infoPlacement');
                $('.dataTables_paginate').appendTo('#pagingPlacement');
            }
        });

        // FUNGSI SEARCH (Koneksi ke Input Kustom)
        $('#customSearchInput').on('keyup', function() {
            table.search(this.value).draw();
        });

        // FUNGSI EXPORT (Koneksi ke Dropdown Kustom)
        $('#btn-print').on('click', function() { table.button(2).trigger(); });
        $('#btn-excel').on('click', function() { table.button(0).trigger(); });
        $('#btn-pdf').on('click', function() { table.button(1).trigger(); });
    });
</script>

</body>
</html>
